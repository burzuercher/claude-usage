[package]
name = "claude-usage"
version = "0.1.0"
description = "Always-on-top desktop widget showing real Claude usage"
authors = ["timz@phase2online.com"]
edition = "2021"

[lib]
name = "claude_usage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "unstable", "tray-icon", "image-png"] }
tauri-plugin-store = "2"
tauri-plugin-autostart = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
window-vibrancy = "0.5"

[profile.release]
# Conservative settings: aggressive LTO + codegen-units=1 crashed rustc while
# compiling the `brotli` dependency on this toolchain. "s" keeps the binary small.
opt-level = "s"
strip = true
